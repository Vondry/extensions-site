name: Code Analysis

on:
  pull_request: null
  push:
    branches:
      - main

env:
  COMPOSER_CACHE_DIR: /tmp/composer-cache

jobs:
  code_analysis:
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
        actions:
          - name: Coding Standard
            run: composer lint -- --ansi

          - name: PHPStan
            run: php bin/console cache:clear --env=dev --ansi && composer phpstan -- --ansi

          - name: Check composer.json and composer.lock
            run: composer validate --strict --ansi

          - name: Check YAML config files
            run: php bin/console lint:yaml config --ansi --parse-tags

          - name: Check Twig files
            run: php bin/console lint:twig public/theme/extensions-2021 public/theme/extensions-2020 public/theme/base-2018 public/theme/skeleton --ansi

          - name: Check XLIFF translation files
            run: php bin/console lint:xliff translations --ansi

          - name: Check Symfony container
            run: php bin/console lint:container --env=prod --ansi

          - name: Check Doctrine mapping
            run: php bin/console doctrine:schema:validate --skip-sync -vvv --no-interaction --ansi

    name: ${{ matrix.actions.name }} - PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, mbstring, pdo, curl, pdo_sqlite, intl, simplexml
          coverage: none
          tools: symfony-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}

      - run: composer install --no-progress --no-interaction

      - run: ${{ matrix.actions.run }}
